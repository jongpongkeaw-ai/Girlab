<svg viewBox="0 0 320 360" role="img" aria-label="Common-emitter amplifier with voltage-divider bias" class="circuit-svg">
  <g class="wire" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round">
    <!-- VCC rail -->
    <line x1="60" y1="40" x2="260" y2="40"/>
    <!-- R1 to base node -->
    <line x1="90" y1="40" x2="90" y2="70"/>
    <line x1="90" y1="120" x2="90" y2="150"/>
    <!-- base node to transistor base -->
    <line x1="90" y1="150" x2="160" y2="150"/>
    <line x1="160" y1="150" x2="160" y2="190"/>
    <line x1="160" y1="190" x2="186" y2="190"/>
    <!-- R2 to ground -->
    <line x1="90" y1="150" x2="90" y2="200"/>
    <line x1="90" y1="250" x2="90" y2="300"/>
    <!-- RC to collector -->
    <line x1="230" y1="40" x2="230" y2="70"/>
    <line x1="230" y1="120" x2="230" y2="150"/>
    <line x1="230" y1="150" x2="218" y2="158"/>
    <line x1="218" y1="158" x2="186" y2="176"/>
    <!-- emitter to RE -->
    <line x1="186" y1="204" x2="218" y2="222"/>
    <line x1="218" y1="222" x2="230" y2="230"/>
    <line x1="230" y1="230" x2="230" y2="250"/>
    <!-- transistor base bar -->
    <line x1="186" y1="168" x2="186" y2="212"/>
    <!-- grounds -->
    <line x1="72" y1="300" x2="108" y2="300"/>
    <line x1="79" y1="305" x2="101" y2="305"/>
    <line x1="86" y1="310" x2="94" y2="310"/>
    <line x1="212" y1="300" x2="248" y2="300"/>
    <line x1="219" y1="305" x2="241" y2="305"/>
    <line x1="226" y1="310" x2="234" y2="310"/>
  </g>

  <g class="component" fill="#ffffff" stroke="#334155" stroke-width="2">
    <rect x="82" y="70" width="16" height="50" rx="2"/>
    <rect x="82" y="200" width="16" height="50" rx="2"/>
    <rect x="222" y="70" width="16" height="50" rx="2"/>
    <rect x="222" y="250" width="16" height="50" rx="2"/>
    <circle cx="202" cy="190" r="34" fill="none"/>
  </g>

  <!-- emitter arrow: points away from the base, toward RE (NPN) -->
  <polygon class="emitter-arrow" fill="#334155" points="213,219 197.6,216.4 202.4,207.6"/>

  <g class="label" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="160" y="28" text-anchor="middle" font-weight="600">VCC</text>
    <text x="72" y="98" text-anchor="end">R1</text>
    <text x="72" y="228" text-anchor="end">R2</text>
    <text x="250" y="98" text-anchor="start">RC</text>
    <text x="250" y="278" text-anchor="start">RE</text>
    <text x="170" y="184" text-anchor="end" font-weight="600">B</text>
    <text x="224" y="152" text-anchor="start" font-weight="600">C</text>
    <text x="224" y="236" text-anchor="start" font-weight="600">E</text>
    <text x="90" y="330" text-anchor="middle">GND</text>
    <text x="230" y="330" text-anchor="middle">GND</text>
  </g>
</svg>
